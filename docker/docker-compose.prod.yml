version: '3.8'

services:
  # ============================================================================
  # 1. PostgreSQL 16 com extensão pgvector (Banco Relacional + Vector Store)
  # ============================================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: coop-postgres-prod
    restart: unless-stopped
    command: postgres -c shared_buffers=64MB -c work_mem=4MB -c maintenance_work_mem=32MB -c effective_cache_size=128MB
    mem_limit: 256m
    environment:
      POSTGRES_DB: coop_onboarding
      POSTGRES_USER: coop_user
      POSTGRES_PASSWORD: coop_pass
    volumes:
      - prod_postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coop_user -d coop_onboarding"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - coop-prod-network

  # ============================================================================
  # 2. Keycloak 25 (Identity & Access Management / OAuth2 / OpenID Connect)
  # ============================================================================
  keycloak:
    image: quay.io/keycloak/keycloak:25.0.2
    container_name: coop-keycloak-prod
    restart: unless-stopped
    command: start-dev --import-realm
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: coop_user
      KC_DB_PASSWORD: coop_pass
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HTTP_PORT: "8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - coop-prod-network

  # ============================================================================
  # 3. Ollama (Motor de IA Local / RAG On-Premise)
  # ============================================================================
  ollama:
    image: ollama/ollama:latest
    container_name: coop-ollama-prod
    restart: unless-stopped
    mem_limit: 1500m
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: "10m"
    volumes:
      - prod_ollama_data:/root/.ollama
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - coop-prod-network

  # ============================================================================
  # 4. Backend (Spring Boot 3.3 / Java 21 / Spring AI)
  # ============================================================================
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: ghcr.io/${GITHUB_REPOSITORY:-raguiohead/coop-onboarding}/backend:${IMAGE_TAG:-latest}
    container_name: coop-backend-prod
    restart: unless-stopped
    mem_limit: 450m
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/coop_onboarding
      SPRING_DATASOURCE_USERNAME: coop_user
      SPRING_DATASOURCE_PASSWORD: coop_pass
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/coop-onboarding
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/coop-onboarding/protocol/openid-connect/certs
      SPRING_AI_OLLAMA_BASE_URL: http://ollama:11434
      SPRING_AI_OLLAMA_CHAT_OPTIONS_MODEL: llama3.2:1b
      SPRING_AI_OLLAMA_EMBEDDING_OPTIONS_MODEL: nomic-embed-text
      JAVA_OPTS: "-XX:+UseSerialGC -Xms128m -Xmx320m -Djava.security.egd=file:/dev/./urandom"
    expose:
      - "8080"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - coop-prod-network

  # ============================================================================
  # 5. Frontend (Vue 3 + Nginx SPA)
  # ============================================================================
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: ghcr.io/${GITHUB_REPOSITORY:-raguiohead/coop-onboarding}/frontend:${IMAGE_TAG:-latest}
    container_name: coop-frontend-prod
    restart: unless-stopped
    mem_limit: 64m
    depends_on:
      - backend
    ports:
      - "80:80"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - coop-prod-network

networks:
  coop-prod-network:
    driver: bridge

volumes:
  prod_postgres_data:
  prod_ollama_data:
