version: '3.8'

services:
  # ============================================================================
  # PostgreSQL 16 com extensão pgvector (armazenamento relacional + vetorial)
  # ============================================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: coop-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: coop_onboarding
      POSTGRES_USER: coop_user
      POSTGRES_PASSWORD: coop_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coop_user -d coop_onboarding"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - coop-network

  # ============================================================================
  # Keycloak 25 (Identity & Access Management / OAuth2 / OpenID Connect)
  # ============================================================================
  keycloak:
    image: quay.io/keycloak/keycloak:25.0.2
    container_name: coop-keycloak
    restart: unless-stopped
    command: start-dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: coop_user
      KC_DB_PASSWORD: coop_pass
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HTTP_PORT: "8080"
    ports:
      - "8180:8080" # Mapeado para 8180 para não conflitar com a porta 8080 do Spring Boot
    networks:
      - coop-network

networks:
  coop-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
