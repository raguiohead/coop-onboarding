name: CI/CD Pipeline - Multi Environment

on:
  push:
    branches:
      - develop      # Ambiente de Desenvolvimento
      - staging      # Ambiente de Homologação (QA / Pre-prod)
      - main         # Ambiente de Produção
  pull_request:
    branches:
      - develop
      - staging
      - main

permissions:
  contents: read
  packages: write    # Permissão para publicar no GitHub Container Registry (ghcr.io)

jobs:
  # ============================================================================
  # 1. Testes Automatizados, Linters e Verificação de Qualidade
  # ============================================================================
  test-and-verify:
    name: 🧪 Test & Verify (Java 21 & Vue 3)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Backend Unit & ArchUnit Architecture Tests
        run: |
          cd backend
          chmod +x mvnw
          ./mvnw test -Dtest="*ArchitectureTest,*Test" -DexcludeTests="*IntegrationTest"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Verify Frontend Build (TypeScript & Vite)
        run: |
          cd frontend
          npm ci
          npm run build

  # ============================================================================
  # 2. Build & Publicação de Imagens Docker no GitHub Container Registry (GHCR)
  # ============================================================================
  docker-build-push:
    name: 🐳 Docker Build & Push (GHCR)
    needs: test-and-verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine Environment Tags
        id: tags
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "repo=$REPO_LOWER" >> $GITHUB_OUTPUT
          
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "env_tag=latest" >> $GITHUB_OUTPUT
            echo "alias_tag=production" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" = "refs/heads/staging" ]; then
            echo "env_tag=staging" >> $GITHUB_OUTPUT
            echo "alias_tag=qa" >> $GITHUB_OUTPUT
          else
            echo "env_tag=dev" >> $GITHUB_OUTPUT
            echo "alias_tag=development" >> $GITHUB_OUTPUT
          fi

      - name: Log in to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build & Push: Backend Spring Boot
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.tags.outputs.repo }}/backend:${{ steps.tags.outputs.env_tag }}
            ghcr.io/${{ steps.tags.outputs.repo }}/backend:${{ steps.tags.outputs.alias_tag }}
            ghcr.io/${{ steps.tags.outputs.repo }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build & Push: Frontend Vue 3 + Nginx
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.tags.outputs.repo }}/frontend:${{ steps.tags.outputs.env_tag }}
            ghcr.io/${{ steps.tags.outputs.repo }}/frontend:${{ steps.tags.outputs.alias_tag }}
            ghcr.io/${{ steps.tags.outputs.repo }}/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # 3. Deploy Automático para o Servidor Web / Nuvem
  # ============================================================================
  deploy:
    name: 🚀 Deploy to Web (Staging & Production)
    needs: docker-build-push
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging') && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check Deployment Secrets
        id: check_secrets
        run: |
          if [ -n "${{ secrets.SERVER_HOST }}" ] && [ -n "${{ secrets.SERVER_SSH_KEY }}" ]; then
            echo "has_secrets=true" >> $GITHUB_OUTPUT
          else
            echo "has_secrets=false" >> $GITHUB_OUTPUT
            echo "::notice ::Secrets SERVER_HOST e SERVER_SSH_KEY não configurados. Passo de deploy SSH remoto ignorado."
          fi

      - name: Deploy via SSH (Quando configurado)
        if: steps.check_secrets.outputs.has_secrets == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/coop-onboarding
            git pull origin main
            docker compose -f docker/docker-compose.prod.yml up -d --build --remove-orphans
