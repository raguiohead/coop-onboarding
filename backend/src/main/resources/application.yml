server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: coop-onboarding

  datasource:
    url: jdbc:postgresql://localhost:5432/coop_onboarding
    username: coop_user
    password: coop_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/coop-onboarding
          jwk-set-uri: http://localhost:8180/realms/coop-onboarding/protocol/openid-connect/certs

  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llama3.2:3b
          temperature: 0.3
          keep_alive: 24h
          num_predict: 512
          top_p: 0.9
          top_k: 40
      embedding:
        options:
          model: nomic-embed-text
          keep_alive: 24h
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 768
        table-name: vector_store
        initialize-schema: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
